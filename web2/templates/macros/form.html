{% macro field_horizontal(label) %}
  <div class="field is-horizontal">
    <div class="field-label">
      <label class="label">{{ label }}</label>
    </div>
    <div class="field-body">
      <div class="field">
        <div class="control">
          {{ caller() }}
        </div>
      </div>
    </div>
  </div>
{% endmacro %}
