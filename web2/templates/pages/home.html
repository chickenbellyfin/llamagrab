{% extends 'base/page.html' %}
{% block content %}
<section class="section" hx-get="/" hx-trigger="every 10s" hx-swap="outerHTML" hx-indicator="output">
  {% call page_header('Server List', back=none) %}
  <a href="/create_server" hx-boost="true" hx-swap='innerHTML' hx-target="#content" class="button is-primary">
    <span class="icon"><i class="bi bi-plus-circle"></i></span>
    <span>Create Server</span>
  </a>
  {% endcall %}
  <div class="columns is-mobile is-multiline is-centered">
    {%for server in servers %}
    <div class="column is-narrow home-card">
      {% with server=server %}
      {% include 'components/server_card.html' %}
      {% endwith %}
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
